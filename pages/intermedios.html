<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATLANMOTION - Próximamente</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="stylesheet" href="../css/estilos.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <!-- Material Symbols Sharp -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    /* ============================================ */
    /* Contenedor general de la cuenta regresiva    */
    /* ============================================ */
    .contador-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      margin: 2.2rem 0 1.8rem 0;
    }

    /* Etiqueta superior: "LANZAMIENTO EN" */
    .contador-etiqueta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffeb3b;
      opacity: 0.9;
    }

    .contador-etiqueta .material-symbols-sharp {
      font-size: 18px;
      color: #ffeb3b;
      margin: 0;
      line-height: 1;
    }

    /* Caja única con solo borde amarillo */
    .contador-caja {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background-color: rgba(255, 235, 59, 0.08);
      border: 1.5px solid rgba(255, 235, 59, 0.45);
      color: #ffeb3b;
      border-radius: 20px;
      padding: 0.7rem 1.3rem;
      box-shadow: 0 8px 28px rgba(255, 235, 59, 0.12);
    }

    /* Cada unidad (DÍAS / HRS / MIN / SEG) */
    .contador-unidad {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 56px;
    }

    .contador-numero {
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    /* Los días un poco más grandes para destacar */
    .contador-unidad.dias .contador-numero {
      font-size: 2.1rem;
    }

    .contador-label {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-top: 5px;
      opacity: 0.75;
    }

    /* Separador ":" */
    .contador-sep {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1;
      padding-bottom: 14px;
      opacity: 0.55;
    }

    /* Separador especial más marcado entre días y horas */
    .contador-sep-fuerte {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1;
      padding-bottom: 14px;
      opacity: 0.4;
      margin: 0 2px;
    }

    /* ============================================ */
    /* Ajustes responsivos                          */
    /* ============================================ */
    @media (max-width: 480px) {
      .contador-wrapper {
        margin: 1.8rem 0 1.4rem 0;
        gap: 0.7rem;
      }

      .contador-etiqueta {
        font-size: 0.7rem;
        letter-spacing: 2px;
      }

      .contador-caja {
        padding: 0.55rem 0.8rem;
        gap: 0.15rem;
        border-radius: 16px;
      }

      .contador-unidad {
        min-width: 42px;
      }

      .contador-numero {
        font-size: 1.25rem;
      }

      .contador-unidad.dias .contador-numero {
        font-size: 1.55rem;
      }

      .contador-label {
        font-size: 0.48rem;
        letter-spacing: 1px;
        margin-top: 4px;
      }

      .contador-sep {
        font-size: 1.1rem;
        padding-bottom: 11px;
      }

      .contador-sep-fuerte {
        font-size: 1.3rem;
        padding-bottom: 11px;
      }
    }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>

  <!-- Sección Principal COMPLETAMENTE CENTRADA -->
  <section class="contenedor-principal-intermedios">
    <div class="contenido-centrado-intermedios">
      <img class="imagen-principal-intermedios" src="../img/intermedios_titulo.png" alt="Próximamente" />
      <p class="texto-descripcion-intermedios">
        Estamos trabajando en nuevas rutinas para usuarios de nivel intermedio.
        Muy pronto podrás llevar tu entrenamiento al siguiente nivel con
        sesiones diseñadas para seguir avanzando con fuerza y enfoque.
      </p>

      <!-- Cuenta regresiva -->
      <div class="contador-wrapper">
        <div class="contador-etiqueta">
          <span class="material-symbols-sharp">hourglass_top</span>
          Lanzamiento en
        </div>

        <div class="contador-caja" id="fecha-lanzamiento">
          <!-- Se rellena con JavaScript -->
        </div>
      </div>

      <div class="contenedor-boton-intermedios">
        <a href="#desafio-intermedios">
          <div class="btnCirculo-intermedios">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="1" class="flecha" viewBox="0 0 24 24">
  <path d="M12 5v14M19 12l-7 7-7-7" />
</svg>
          </div>
        </a>
      </div>
    </div>
  </section>

  <!-- Sección Video CENTRADA -->
  <section id="desafio-intermedios" class="seccion-video-intermedios">
    <div class="contenedor-video-intermedios">
      <iframe class="video-iframe-intermedios" src="https://www.youtube.com/embed/Fmb0Lk7xD4w?si=554OA6VIchRlpHDG"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
      </iframe>
    </div>
  </section>

  <!-- Script para cargar el header -->
  <script>
    fetch('../header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      })
      .catch(error => {
        console.error('Error cargando el header:', error);
      });
  </script>

  <!-- Script de la cuenta regresiva REAL basada en la hora del día -->
  <script>
    (function() {
      const elementoFecha = document.getElementById('fecha-lanzamiento');

      function pad(n) {
        return n < 10 ? '0' + n : '' + n;
      }

      function actualizar() {
        // Días SIEMPRE fijos en 12
        const dias = 12;

        // Hora actual del sistema
        const ahora = new Date();

        // Segundos transcurridos del día actual
        const segundosDelDia =
          ahora.getHours() * 3600 +
          ahora.getMinutes() * 60 +
          ahora.getSeconds();

        // Segundos restantes para que termine el día (medianoche)
        const segundosRestantes = 86400 - segundosDelDia;

        const horas = Math.floor(segundosRestantes / 3600);
        const minutos = Math.floor((segundosRestantes % 3600) / 60);
        const segundos = segundosRestantes % 60;

        elementoFecha.innerHTML =
          '<div class="contador-unidad dias">' +
            '<span class="contador-numero">' + dias + '</span>' +
            '<span class="contador-label">DÍAS</span>' +
          '</div>' +
          '<span class="contador-sep-fuerte">:</span>' +
          '<div class="contador-unidad">' +
            '<span class="contador-numero">' + pad(horas) + '</span>' +
            '<span class="contador-label">HRS</span>' +
          '</div>' +
          '<span class="contador-sep">:</span>' +
          '<div class="contador-unidad">' +
            '<span class="contador-numero">' + pad(minutos) + '</span>' +
            '<span class="contador-label">MIN</span>' +
          '</div>' +
          '<span class="contador-sep">:</span>' +
          '<div class="contador-unidad">' +
            '<span class="contador-numero">' + pad(segundos) + '</span>' +
            '<span class="contador-label">SEG</span>' +
          '</div>';
      }

      actualizar();
      setInterval(actualizar, 1000);
    })();
  </script>

  <script src="../js/scripts.js"></script>
</body>

</html>
